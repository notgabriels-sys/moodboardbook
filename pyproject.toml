[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moodboardbook"
version = "0.1.0"
description = "Offline annotated local image reference-board builder for art direction review."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gabriel García Alonso" }]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2"]

[project.scripts]
moodboardbook = "moodboardbook.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
